name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: no permissions by default; scoped per-job below.
permissions: {}

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configure-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

  validate:
    needs: configure-pages
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.configure-pages.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild esbuild

      - name: Dependency security audit
        run: npm run audit:dependencies

      - name: Run pull request gate
        if: github.event_name == 'pull_request'
        run: npm run verify

      - name: Build and verify Pages candidate once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          INNER_ECHO_PAGES_BASE_PATH: ${{ needs.configure-pages.outputs.base_path }}
          CANDIDATE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          npm run pages:build
          npm run pages:verify
          npm run notices:verify
          node tools/deployment/write-pages-handoff.mjs

      - name: Upload verified site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pages-candidate-site-${{ github.run_attempt }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload candidate identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pages-candidate-metadata-${{ github.run_attempt }}
          path: reports/pages-handoff/candidate.json
          if-no-files-found: error
          retention-days: 7
