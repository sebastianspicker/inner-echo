name: CI

on:
  workflow_dispatch:
  pull_request:

# Least-privilege: no permissions by default; scoped per-job below.
permissions: {}

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild esbuild

      - name: Dependency security audit
        run: npm run audit:dependencies

      - name: Run validation gate
        run: npm run verify

      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-verification-reports
          path: reports/contract-verification.*

      - name: Upload inspect report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inspect-report
          path: reports/inspect.json
