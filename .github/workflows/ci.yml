name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: no permissions by default; scoped per-job below.
permissions: {}

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Verify JSON-runtime contracts
        run: npm run verify:contracts

      - name: Validate conditions
        run: npm run conditions:validate

      - name: Validate composer
        run: npm run composer:validate

      - name: Verify evidence
        run: npm run evidence:verify

      - name: Debug inspect harness
        run: npm run debug:inspect

      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: contract-verification-reports
          path: reports/contract-verification.*

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage/

      - name: Upload inspect report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: inspect-report
          path: reports/inspect.json

  release_candidate_gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run RC local gate parity
        run: npm run release:rc:local

      - name: Verify README screenshot assets
        run: npm run screenshots:verify

      - name: Upload RC reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rc-reports
          path: |
            reports/**
            assets/readme/screenshots/manifest.json
