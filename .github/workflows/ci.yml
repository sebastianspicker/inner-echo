name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: no permissions by default; scoped per-job below.
permissions: {}

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Verify JSON-runtime contracts
        run: npm run verify:contracts

      - name: Validate conditions
        run: npm run conditions:validate

      - name: Validate composer
        run: npm run composer:validate

      - name: Verify evidence
        run: npm run evidence:verify

      - name: Debug inspect harness
        run: npm run debug:inspect

      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-verification-reports
          path: reports/contract-verification.*

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

      - name: Upload inspect report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspect-report
          path: reports/inspect.json

  release_candidate_gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chrome firefox webkit

      - name: Run RC local gate parity
        run: npm run release:rc:local

      - name: Verify README screenshot assets
        run: npm run screenshots:verify

      - name: Upload RC reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-reports
          path: |
            reports/**
            assets/readme/screenshots/manifest.json
