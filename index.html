<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover allows the app to draw into mobile safe areas (like the iOS notch) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Header-capable hosts deliver CSP as a response header. The Pages build injects a production-only meta fallback. -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f1112" />
  <meta name="description" content="A camera mirror for talking about inner experience: gentle audiovisual metaphors, processed only in your browser." />
  <link rel="icon" type="image/svg+xml" href="/assets/brand/inner-echo-favicon.svg" />
  <title>Inner Echo - a camera mirror for talking about inner experience</title>
</head>

<body>
  <noscript>
    <strong>Inner Echo requires JavaScript. Enable it to continue.</strong>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
